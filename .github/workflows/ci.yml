name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install production dependencies
        # Unit tests run against prod deps only — same environment as Render.
        # Catches the "we accidentally rely on a test-only package" bug class.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke import
        run: python -c "import app, http_cache, policy_retrieval, property_parser, municipality_lookup, zoning_providers; print('ok')"

      - name: Run unit tests
        env:
          # Keep CI hermetic — never hit live municipal APIs.
          RUN_LIVE_TESTS: ""
        run: python -m unittest discover -v

  e2e:
    name: Playwright e2e (chromium)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies (incl. Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright tests
        run: python -m pytest tests_e2e/ -v

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
